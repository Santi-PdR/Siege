name: Build Forge mod

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Restore generated Intel source
        shell: bash
        run: |
          gzip -dc assets-source/generated/IntelScreenV3.java.gz > src/main/java/uy/santipdr/siege/client/IntelScreenV3.java
      - name: Enforce circular dossier navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/java/uy/santipdr/siege/client/IntelScreenV3.java")
          source = path.read_text(encoding="utf-8")

          navigation = next((
              name for name in ("stepEntry", "stepFile")
              if re.search(r"\b" + name + r"\s*\(\s*int\s+", source)
          ), None)
          if navigation is None:
              raise SystemExit("IntelScreenV3 has no supported dossier navigation method")

          signature = "public boolean keyPressed(int keyCode, int scanCode, int modifiers) {"
          if signature not in source:
              raise SystemExit("IntelScreenV3 keyPressed signature was not found")

          marker = "// SIEGE_CIRCULAR_ARROW_NAVIGATION"
          if marker not in source:
              controls = f"""{{signature}}
                  {marker}
                  if (keyCode == org.lwjgl.glfw.GLFW.GLFW_KEY_LEFT) {{
                      {navigation}(-1);
                      return true;
                  }}
                  if (keyCode == org.lwjgl.glfw.GLFW.GLFW_KEY_RIGHT) {{
                      {navigation}(1);
                      return true;
                  }}"""
              source = source.replace(signature, controls, 1)
              path.write_text(source, encoding="utf-8")
          PY
      - name: Prepare Intel dossier overlays
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pillow numpy
          python3 scripts/prepare-intel-assets.py
      - name: Prepare full SIEGE soundtrack
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            # Chrome is unrelated to this build and its hosted-runner mirror can become
            # temporarily inconsistent. Disable any Chrome source file (.list or .sources)
            # before refreshing the Ubuntu package indexes used for ffmpeg.
            while IFS= read -r source_file; do
              sudo mv "$source_file" "$source_file.disabled"
            done < <(grep -rl 'dl\.google\.com/linux/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          bash scripts/prepare-music.sh
      - name: Verify clean boss frames
        shell: bash
        run: |
          if grep -nE '"REC "|"STILL "|recordWidth|String record' src/main/java/uy/santipdr/siege/client/IntelScreen*.java; then
            echo "Boss frames must not draw REC/STILL counters over their images."
            exit 1
          fi
          if grep -nE 'FRAME:.*frame_index|FRAME:.*BOSS_FRAME_COUNT' scripts/prepare-intel-assets.py; then
            echo "Generated Boss dossier art must not contain a per-frame counter."
            exit 1
          fi
      - name: Compile and verify
        run: gradle --no-daemon clean build
      - uses: actions/upload-artifact@v4
        with:
          name: siege-menu-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Publish validated jar for installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          jar_path="$(find build/libs -maxdepth 1 -type f -name 'siege-menu-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          test -n "$jar_path"
          mkdir -p dist
          rm -f dist/siege-menu-*.jar
          cp "$jar_path" dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          if ! git diff --cached --quiet; then
            git commit -m "build: publish validated Siege jar [skip ci]"
            git push
          fi
