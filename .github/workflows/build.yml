name: Build Forge mod

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: siege-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Fetch verified DVN media
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pillow yt-dlp
          bash scripts/fetch-dvn-media-510.sh

      - name: Prepare and audit SIEGE visual media
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pillow
          if test -f assets-source/third-justice/third_justice_full.mp4 && { ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; }; then
            while IFS= read -r source_file; do
              sudo mv "$source_file" "$source_file.disabled"
            done < <(grep -rl 'dl\.google\.com/linux/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          python3 scripts/prepare-backgrounds-hd.py
          python3 scripts/audit-backgrounds-530.py

      - name: Verify responsive layouts, knowledge and Operations search
        shell: bash
        run: |
          mkdir -p build/layout-tests build/guide-tests build/guide-media-tests build/archive-tests build/config-tests build/scene-tests build/knowledge-tests build/atlas-tests build/race-atlas-tests build/progression-tests build/media-tests build/ops-tests
          javac -d build/layout-tests src/main/java/uy/santipdr/siege/client/SiegeGalleryLayout.java src/main/java/uy/santipdr/siege/client/SiegeIntelLayout.java src/main/java/uy/santipdr/siege/client/IntelSearch.java src/main/java/uy/santipdr/siege/client/IntelPresentation.java src/main/java/uy/santipdr/siege/client/SiegeImageViewport.java src/main/java/uy/santipdr/siege/client/SiegeUiLayout.java src/main/java/uy/santipdr/siege/client/IntelEntry.java tests/UiRegressionTest.java
          java -cp build/layout-tests UiRegressionTest
          javac -d build/layout-tests src/main/java/uy/santipdr/siege/client/SiegeMultiplayerLayout.java tests/MultiplayerLayoutTest.java
          java -cp build/layout-tests MultiplayerLayoutTest
          javac -d build/guide-tests src/main/java/uy/santipdr/siege/client/IntelSearch.java src/main/java/uy/santipdr/siege/client/SiegeGuideLayout.java src/main/java/uy/santipdr/siege/client/SiegeGuideData.java tests/GuideRegressionTest.java
          java -cp build/guide-tests GuideRegressionTest
          javac -d build/guide-media-tests src/main/java/uy/santipdr/siege/client/IntelSearch.java src/main/java/uy/santipdr/siege/client/SiegeGuideData.java src/main/java/uy/santipdr/siege/client/SiegeGuideSupplemental.java tests/GuideMediaRegressionTest.java
          java -cp build/guide-media-tests GuideMediaRegressionTest
          javac -d build/archive-tests src/main/java/uy/santipdr/siege/client/IntelSearch.java src/main/java/uy/santipdr/siege/client/SiegeArchiveData.java tests/ArchiveRegressionTest.java
          java -cp build/archive-tests ArchiveRegressionTest
          javac -d build/config-tests tests/stubs/net/minecraftforge/fml/loading/FMLPaths.java tests/stubs/com/mojang/logging/LogUtils.java src/main/java/uy/santipdr/siege/client/SiegeConfig.java src/main/java/uy/santipdr/siege/client/SiegeSceneCatalog.java src/main/java/uy/santipdr/siege/client/SiegeSceneSchedule.java tests/ConfigRegressionTest.java
          java -cp build/config-tests ConfigRegressionTest
          javac -d build/scene-tests src/main/java/uy/santipdr/siege/client/SiegeSceneCatalog.java src/main/java/uy/santipdr/siege/client/SiegeSceneSchedule.java tests/SceneScheduleTest.java
          java -cp build/scene-tests SceneScheduleTest
          javac -d build/knowledge-tests src/main/java/uy/santipdr/siege/client/SiegeKnowledgeData.java tests/KnowledgeDataRegressionTest.java
          java -cp build/knowledge-tests KnowledgeDataRegressionTest
          javac -d build/atlas-tests src/main/java/uy/santipdr/siege/client/SiegeKnowledgeData.java src/main/java/uy/santipdr/siege/client/SiegeKnowledgeExpansion40.java src/main/java/uy/santipdr/siege/client/SiegeKnowledgeExpansion50.java src/main/java/uy/santipdr/siege/client/SiegeKnowledgeCorpus50.java src/main/java/uy/santipdr/siege/client/SiegeKnowledgePlayer510.java src/main/java/uy/santipdr/siege/client/SiegeKnowledgePlayer540.java src/main/java/uy/santipdr/siege/client/SiegeKnowledgeRegistry.java src/main/java/uy/santipdr/siege/client/SiegeAtlasIndex.java tests/AtlasRegressionTest.java
          java -cp build/atlas-tests AtlasRegressionTest
          javac -d build/race-atlas-tests src/main/java/uy/santipdr/siege/client/SiegeRaceAtlasData.java tests/RaceAtlasRegressionTest.java
          java -cp build/race-atlas-tests RaceAtlasRegressionTest
          javac -d build/progression-tests src/main/java/uy/santipdr/siege/client/SiegeProgressionData.java tests/ProgressionMapRegressionTest.java
          java -cp build/progression-tests ProgressionMapRegressionTest
          javac -d build/media-tests src/main/java/uy/santipdr/siege/client/SiegeMediaReferenceData.java tests/MediaReferenceRegressionTest.java
          java -cp build/media-tests MediaReferenceRegressionTest
          javac -d build/ops-tests src/main/java/uy/santipdr/siege/client/IntelSearch.java src/main/java/uy/santipdr/siege/client/IntelEntry.java src/main/java/uy/santipdr/siege/client/AgreementReport.java src/main/java/uy/santipdr/siege/client/IntelData.java src/main/java/uy/santipdr/siege/client/IntelCurrentData.java src/main/java/uy/santipdr/siege/client/IntelCatalog.java src/main/java/uy/santipdr/siege/client/SiegeKnowledgeData.java src/main/java/uy/santipdr/siege/client/SiegeKnowledgeExpansion40.java src/main/java/uy/santipdr/siege/client/SiegeKnowledgeExpansion50.java src/main/java/uy/santipdr/siege/client/SiegeKnowledgeCorpus50.java src/main/java/uy/santipdr/siege/client/SiegeKnowledgePlayer510.java src/main/java/uy/santipdr/siege/client/SiegeKnowledgePlayer540.java src/main/java/uy/santipdr/siege/client/SiegeKnowledgeRegistry.java src/main/java/uy/santipdr/siege/client/SiegeCommandNetwork.java src/main/java/uy/santipdr/siege/client/SiegeOperationsIndex.java src/main/java/uy/santipdr/siege/client/SiegeRouteHistory.java tests/OperationsIndexTest.java
          java -cp build/ops-tests OperationsIndexTest
          python3 tests/test_installer.py
          python3 tests/test_release_040.py
          python3 tests/test_release_050.py
          python3 tests/test_release_510.py
          python3 tests/test_release_530.py
          python3 tests/test_release_540.py
          python3 tests/test_release_550.py
          python3 tests/test_release_560.py

      - name: Verify menu theme scope and drawing bounds
        run: |
          javac -d build/theme-tests src/main/java/uy/santipdr/siege/client/SiegeMenuPolicy.java tests/MenuThemePolicyTest.java
          java -cp build/theme-tests MenuThemePolicyTest
          javac -d build/theme-tests src/main/java/uy/santipdr/siege/client/SiegeSliderGeometry.java tests/SliderGeometryTest.java
          java -cp build/theme-tests SliderGeometryTest
          javac -d build/theme-tests src/main/java/uy/santipdr/siege/client/SiegeControlLayout.java tests/ControlLayoutTest.java
          java -cp build/theme-tests ControlLayoutTest
          javac -d build/theme-tests src/main/java/uy/santipdr/siege/client/SiegeScreenRouter.java tests/ScreenRouterTest.java
          java -cp build/theme-tests ScreenRouterTest
          javac -d build/navigation-tests src/main/java/uy/santipdr/siege/client/SiegeUiLayout.java src/main/java/uy/santipdr/siege/client/SiegeNavigationModel.java tests/NavigationIdentityTest.java
          java -cp build/navigation-tests NavigationIdentityTest
          javac -d build/theme-drawing tests/theme-stubs/net/minecraft/client/gui/GuiGraphics.java src/main/java/uy/santipdr/siege/client/SiegeTheme.java tests/MenuThemeDrawingTest.java
          java -cp build/theme-drawing MenuThemeDrawingTest

      - name: Verify SIEGE 5.60 player-facing contracts
        shell: bash
        run: |
          grep -q "version = '5.60.0'" build.gradle
          grep -q 'class SiegeKnowledgeExpansion50' src/main/java/uy/santipdr/siege/client/SiegeKnowledgeExpansion50.java
          grep -q 'class SiegeKnowledgeCorpus50' src/main/java/uy/santipdr/siege/client/SiegeKnowledgeCorpus50.java
          grep -q 'class SiegeKnowledgePlayer510' src/main/java/uy/santipdr/siege/client/SiegeKnowledgePlayer510.java
          grep -q 'class SiegeKnowledgePlayer540' src/main/java/uy/santipdr/siege/client/SiegeKnowledgePlayer540.java
          grep -q 'SiegeKnowledgePlayer540.entries' src/main/java/uy/santipdr/siege/client/SiegeKnowledgeRegistry.java
          grep -q '"el-nucleo"' src/main/java/uy/santipdr/siege/client/SiegeKnowledgePlayer540.java
          grep -q '"stronghold-55"' src/main/java/uy/santipdr/siege/client/SiegeKnowledgePlayer540.java
          grep -q '"factions-current-front"' src/main/java/uy/santipdr/siege/client/SiegeKnowledgePlayer540.java
          grep -q '3 bloques de hierro + 1 mesa de encantamientos' src/main/java/uy/santipdr/siege/client/SiegeKnowledgePlayer510.java
          grep -q '3 bloques de hierro + 1 bloque de oro' src/main/java/uy/santipdr/siege/client/SiegeKnowledgePlayer510.java
          grep -q '"raid-area-discipline"' src/main/java/uy/santipdr/siege/client/SiegeKnowledgeRegistry.java
          grep -q 'enum Lane { DEPLOYMENT, INTELLIGENCE, REFERENCE }' src/main/java/uy/santipdr/siege/client/SiegeCommandNetwork.java
          grep -q 'Mode { START, RACES, PROGRESSION, SYSTEMS, ITEMS }' src/main/java/uy/santipdr/siege/client/SiegeKnowledgeScreen.java
          grep -q 'enum View { RACES, PROGRESSION, SYSTEMS, ITEMS }' src/main/java/uy/santipdr/siege/client/SiegeAtlasIndex.java
          grep -q 'new SiegeRaceVariantsScreen' src/main/java/uy/santipdr/siege/client/SiegeKnowledgeFileScreen.java
          grep -q 'subhuman-rick-sanchez' src/main/java/uy/santipdr/siege/client/SiegeRaceVariantsScreen.java
          grep -q 'class SiegeNavigationCleanupEvents' src/main/java/uy/santipdr/siege/client/SiegeNavigationCleanupEvents.java
          grep -q 'SimpleSoundInstance.forUI(event, 1.0F, volume)' src/main/java/uy/santipdr/siege/client/SiegeUiSounds.java
          for scene in dvn_official_01 dvn_official_02 dvn_official_03 dvn_official_04 dvn_official_05 dvn_official_06 nucleus_interference tesla_breach stronghold_red_alert; do
            grep -q "$scene" src/main/java/uy/santipdr/siege/client/SiegeSceneCatalog.java
          done
          grep -q 'generate-siege-backgrounds-550.py' scripts/prepare-backgrounds-hd.py
          grep -q 'SiegeThirdJusticeVideo' src/main/java/uy/santipdr/siege/client/SiegeEvidenceReelScreen.java
          grep -q 'third_justice_full.mp4' scripts/prepare-third-justice-media.py
          grep -q 'SiegeMod.ARC_ENEMY' src/main/java/uy/santipdr/siege/client/SiegeMusic.java
          grep -q 'SiegeMod.A_STRANGER_I_REMAIN' src/main/java/uy/santipdr/siege/client/SiegeMusic.java
          grep -q 'SiegeMod.RECEIVE_YOU_HYPERACTIVE' src/main/java/uy/santipdr/siege/client/SiegeMusic.java
          grep -q 'a_stranger_i_remain' scripts/prepare-music.sh
          grep -q 'receive_you_the_hyperactive' scripts/prepare-music.sh
          if grep -nE 'STRONGHOLD_BLACK_SIGNAL|NUCLEUS_SILENT_CARRIER|TESLA_BREACH' src/main/java/uy/santipdr/siege/SiegeMod.java src/main/java/uy/santipdr/siege/client/SiegeMusic.java; then
            echo "Rejected generated music must not return to SIEGE."
            exit 1
          fi
          grep -q 'class SiegeMediaPresets' src/main/java/uy/santipdr/siege/client/SiegeMediaPresets.java
          grep -q 'SiegeMediaPresets.apply' src/main/java/uy/santipdr/siege/client/SiegeMediaRoomScreen.java
          if grep -nE 'TAMBIÉN VER|SEE ALSO' src/main/java/uy/santipdr/siege/client/SiegeKnowledgeScreen.java src/main/java/uy/santipdr/siege/client/SiegeKnowledgeFileScreen.java src/main/java/uy/santipdr/siege/client/SiegeAtlasScreen.java; then
            echo "Generic see-also text must not return to player surfaces."
            exit 1
          fi
          if grep -nEi 'mi inventario|mi personaje|mi partida actual|player notebook|private build|120 wins|220 wins' src/main/java/uy/santipdr/siege/client/SiegeKnowledgePlayer510.java src/main/java/uy/santipdr/siege/client/SiegeKnowledgePlayer540.java src/main/java/uy/santipdr/siege/client/SiegeRaceAtlasData.java src/main/java/uy/santipdr/siege/client/SiegeProgressionData.java; then
            echo "Server knowledge must remain non-personal."
            exit 1
          fi
          grep -q 'TEMPEST_JUTCHERSON' src/main/java/uy/santipdr/siege/client/SiegeEasterEggVault.java
          if grep -q 'tempest_jutcherson' src/main/java/uy/santipdr/siege/client/SiegeSceneCatalog.java; then
            echo "Tempest Jutcherson must not be a normal menu/gallery scene."
            exit 1
          fi
          if grep -q 'tempest_jutcherson' scripts/prepare-backgrounds-hd.py; then
            echo "Tempest Jutcherson must not be processed as a normal menu background."
            exit 1
          fi
          grep -q 'GLFW_KEY_LEFT' src/main/java/uy/santipdr/siege/client/IntelScreenV3.java
          grep -q 'GLFW_KEY_RIGHT' src/main/java/uy/santipdr/siege/client/IntelScreenV3.java
          if grep -nE 'FAVORITES|toggleFavoriteIntel|favoriteButton|addIndexButton|copyText|GUARDAR' src/main/java/uy/santipdr/siege/client/IntelScreenV3.java; then
            echo "Removed Intel controls must not return."
            exit 1
          fi
          if grep -qE 'GLFW_KEY_(I|P|G|M|R|HOME|END)([^A-Z0-9_]|$)' src/main/java/uy/santipdr/siege/client/SiegeTitleScreen.java; then
            echo "The title screen contains an unrequested keyboard shortcut."
            exit 1
          fi

      - uses: actions/cache@v4
        id: intel-cache
        with:
          path: src/main/resources/assets/siege/textures/gui/intel
          key: intel-v1-${{ runner.os }}-${{ hashFiles('assets-source/intel-raw/**', 'src/main/resources/assets/siege/textures/gui/intel/**', 'scripts/prepare-intel-assets.py') }}
      - name: Prepare Intel dossier overlays
        if: steps.intel-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pillow numpy
          python3 scripts/prepare-intel-assets.py

      - uses: actions/cache@v4
        id: music-cache
        with:
          path: |
            src/main/resources/assets/siege/sounds/music
            src/main/resources/assets/siege/music_durations.properties
          key: music-v6-${{ runner.os }}-${{ hashFiles('assets-source/music-full/**', 'scripts/prepare-music.sh', 'scripts/fetch-dvn-media-510.sh') }}
      - name: Prepare clean SIEGE soundtrack
        if: steps.music-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            while IFS= read -r source_file; do
              sudo mv "$source_file" "$source_file.disabled"
            done < <(grep -rl 'dl\.google\.com/linux/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          bash scripts/prepare-music.sh

      - name: Verify every SIEGE audio file decodes cleanly
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          for file in src/main/resources/assets/siege/sounds/music/*.ogg src/main/resources/assets/siege/sounds/ui/*.ogg; do
            test -f "$file"
            ffmpeg -v error -xerror -i "$file" -f null -
            codec="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$file")"
            rate="$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of csv=p=0 "$file")"
            test "$codec" = "vorbis"
            test "$rate" = "44100"
          done
          test -s src/main/resources/assets/siege/sounds/music/tale_cruel_world.ogg
          test -s src/main/resources/assets/siege/sounds/music/darkest_of_days.ogg
          test -s src/main/resources/assets/siege/sounds/music/kaptain_music_box.ogg
          test -s src/main/resources/assets/siege/sounds/music/heavens_hell_sent_gift.ogg
          test -s src/main/resources/assets/siege/sounds/music/arc_enemy.ogg
          for optional in a_stranger_i_remain receive_you_the_hyperactive; do
            if test -f "src/main/resources/assets/siege/sounds/music/$optional.ogg"; then
              test -s "src/main/resources/assets/siege/sounds/music/$optional.ogg"
              grep -q "^$optional=" src/main/resources/assets/siege/music_durations.properties
            fi
          done

      - name: Verify clean boss frames
        shell: bash
        run: |
          if grep -nE '"REC "|"STILL "|recordWidth|String record' src/main/java/uy/santipdr/siege/client/IntelScreen*.java; then
            echo "Boss frames must not draw REC/STILL counters over their images."
            exit 1
          fi
          if grep -nE 'FRAME:.*frame_index|FRAME:.*BOSS_FRAME_COUNT' scripts/prepare-intel-assets.py; then
            echo "Generated Boss dossier art must not contain a per-frame counter."
            exit 1
          fi

      - name: Verify audio, Intel and all GUI resources
        run: |
          javac -d build/runtime-tests src/main/java/uy/santipdr/siege/client/IntelEntry.java src/main/java/uy/santipdr/siege/client/AgreementReport.java src/main/java/uy/santipdr/siege/client/IntelData.java src/main/java/uy/santipdr/siege/client/IntelCurrentData.java src/main/java/uy/santipdr/siege/client/IntelCatalog.java src/main/java/uy/santipdr/siege/client/IntelPresentation.java src/main/java/uy/santipdr/siege/client/SiegeAudioHealth.java src/main/java/uy/santipdr/siege/client/SiegePreviewClock.java tests/RuntimeRegressionTest.java
          java -cp build/runtime-tests uy.santipdr.siege.client.RuntimeRegressionTest
          javac -d build/gui-resource-tests src/main/java/uy/santipdr/siege/client/SiegeSceneCatalog.java src/main/java/uy/santipdr/siege/client/SiegeEasterEggVault.java tests/GuiResourceRegressionTest.java
          java -cp build/gui-resource-tests GuiResourceRegressionTest

      - name: Compile and verify
        run: gradle --no-daemon reportBuildTools clean build

      - uses: actions/upload-artifact@v4
        with:
          name: siege-menu-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish validated jar for installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          jar_path="$(find build/libs -maxdepth 1 -type f -name 'siege-menu-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          test -n "$jar_path"
          mkdir -p dist
          rm -f dist/siege-menu-*.jar
          cp "$jar_path" dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/write-manifest.py "$jar_path" "${{ github.sha }}"
          git add -f dist/
          if ! git diff --cached --quiet; then
            git commit -m "build: publish validated Siege jar [skip ci]"
            git push
          fi
