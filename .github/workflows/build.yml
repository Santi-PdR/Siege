name: Build Forge mod

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: siege-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Verify responsive layouts and Intel search
        shell: bash
        run: |
          mkdir -p build/layout-tests
          javac -d build/layout-tests src/main/java/uy/santipdr/siege/client/SiegeGalleryLayout.java src/main/java/uy/santipdr/siege/client/SiegeIntelLayout.java src/main/java/uy/santipdr/siege/client/IntelSearch.java src/main/java/uy/santipdr/siege/client/IntelPresentation.java src/main/java/uy/santipdr/siege/client/SiegeImageViewport.java src/main/java/uy/santipdr/siege/client/SiegeUiLayout.java src/main/java/uy/santipdr/siege/client/IntelEntry.java tests/UiRegressionTest.java
          java -cp build/layout-tests UiRegressionTest
          javac -d build/config-tests tests/stubs/net/minecraftforge/fml/loading/FMLPaths.java tests/stubs/com/mojang/logging/LogUtils.java src/main/java/uy/santipdr/siege/client/SiegeConfig.java tests/ConfigRegressionTest.java
          java -cp build/config-tests ConfigRegressionTest
          python3 tests/test_installer.py
          python3 tests/test_release_014.py
      - name: Verify dossier navigation
        shell: bash
        run: |
          grep -q 'GLFW_KEY_LEFT' src/main/java/uy/santipdr/siege/client/IntelScreenV3.java
          grep -q 'GLFW_KEY_RIGHT' src/main/java/uy/santipdr/siege/client/IntelScreenV3.java
          grep -q 'Math.floorMod(selected + direction, files.size())' src/main/java/uy/santipdr/siege/client/IntelScreenV3.java
          grep -q 'Component.literal("←")' src/main/java/uy/santipdr/siege/client/IntelScreenV3.java
          grep -q 'Component.literal("→")' src/main/java/uy/santipdr/siege/client/IntelScreenV3.java
          grep -q 'isInsidePreviewFooter' src/main/java/uy/santipdr/siege/client/SiegeTitleScreen.java
          grep -q 'previewDual' src/main/java/uy/santipdr/siege/client/SiegeTitleScreen.java
          grep -q 'mouseScrolled' src/main/java/uy/santipdr/siege/client/SiegeSceneScreen.java
          grep -q 'VISTA LIMPIA' src/main/java/uy/santipdr/siege/client/SiegeSceneScreen.java
          grep -q 'ROTACIÓN AUTO' src/main/java/uy/santipdr/siege/client/SiegeSceneScreen.java
          grep -q 'IntelScreenV3(Screen parent, IntelEntry requestedEntry)' src/main/java/uy/santipdr/siege/client/IntelScreenV3.java
          grep -q 'targetCode.equals(files.get(i).code())' src/main/java/uy/santipdr/siege/client/IntelScreenV3.java
          grep -q 'new IntelScreenV3(this, entry)' src/main/java/uy/santipdr/siege/client/SiegeTitleScreen.java
          if grep -nE 'FAVORITES|toggleFavoriteIntel|favoriteButton|addIndexButton|copyText|GUARDAR' src/main/java/uy/santipdr/siege/client/IntelScreenV3.java; then
            echo "Removed Intel controls must not return"
            exit 1
          fi
          grep -q 'trackAnnouncementDurationMs' src/main/java/uy/santipdr/siege/client/SiegeMusic.java
          grep -q 'backgroundDarkness' src/main/java/uy/santipdr/siege/client/SiegeBackgrounds.java
          if grep -qE 'GLFW_KEY_(I|P|G|M|R|HOME|END)([^A-Z0-9_]|$)' src/main/java/uy/santipdr/siege/client/SiegeTitleScreen.java; then
            echo "The title screen contains an unrequested keyboard shortcut."
            exit 1
          fi
          if grep -qE 'GLFW_KEY_(SPACE|P|R|X|HOME|END|F1|[1-9])([^A-Z0-9_]|$)' src/main/java/uy/santipdr/siege/client/SiegeSceneScreen.java; then
            echo "The gallery contains an unrequested keyboard shortcut."
            exit 1
          fi
          if grep -qE 'GLFW_KEY_(Q|E|F|HOME|END|PAGE_UP|PAGE_DOWN|UP|DOWN|[0-9])([^A-Z0-9_]|$)' src/main/java/uy/santipdr/siege/client/IntelScreenV3.java; then
            echo "Intel contains an unrequested keyboard shortcut."
            exit 1
          fi
      - uses: actions/cache@v4
        id: intel-cache
        with:
          path: src/main/resources/assets/siege/textures/gui/intel
          key: intel-v1-${{ runner.os }}-${{ hashFiles('assets-source/intel-raw/**', 'src/main/resources/assets/siege/textures/gui/intel/**', 'scripts/prepare-intel-assets.py') }}
      - name: Prepare Intel dossier overlays
        if: steps.intel-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pillow numpy
          python3 scripts/prepare-intel-assets.py
      - uses: actions/cache@v4
        id: music-cache
        with:
          path: |
            src/main/resources/assets/siege/sounds/music
            src/main/resources/assets/siege/music_durations.properties
          key: music-v1-${{ runner.os }}-${{ hashFiles('assets-source/music-full/**', 'scripts/prepare-music.sh') }}
      - name: Prepare full SIEGE soundtrack
        if: steps.music-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            # Chrome is unrelated to this build and its hosted-runner mirror can become
            # temporarily inconsistent. Disable any Chrome source file (.list or .sources)
            # before refreshing the Ubuntu package indexes used for ffmpeg.
            while IFS= read -r source_file; do
              sudo mv "$source_file" "$source_file.disabled"
            done < <(grep -rl 'dl\.google\.com/linux/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          bash scripts/prepare-music.sh
      - name: Verify clean boss frames
        shell: bash
        run: |
          if grep -nE '"REC "|"STILL "|recordWidth|String record' src/main/java/uy/santipdr/siege/client/IntelScreen*.java; then
            echo "Boss frames must not draw REC/STILL counters over their images."
            exit 1
          fi
          if grep -nE 'FRAME:.*frame_index|FRAME:.*BOSS_FRAME_COUNT' scripts/prepare-intel-assets.py; then
            echo "Generated Boss dossier art must not contain a per-frame counter."
            exit 1
          fi
      - name: Verify audio state and catalog resources
        run: |
          javac -d build/runtime-tests src/main/java/uy/santipdr/siege/client/IntelEntry.java src/main/java/uy/santipdr/siege/client/IntelData.java src/main/java/uy/santipdr/siege/client/IntelCatalog.java src/main/java/uy/santipdr/siege/client/IntelPresentation.java src/main/java/uy/santipdr/siege/client/SiegeAudioHealth.java src/main/java/uy/santipdr/siege/client/SiegePreviewClock.java tests/RuntimeRegressionTest.java
          java -cp build/runtime-tests uy.santipdr.siege.client.RuntimeRegressionTest
      - name: Compile and verify
        run: gradle --no-daemon reportBuildTools clean build
      - uses: actions/upload-artifact@v4
        with:
          name: siege-menu-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Publish validated jar for installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          jar_path="$(find build/libs -maxdepth 1 -type f -name 'siege-menu-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          test -n "$jar_path"
          mkdir -p dist
          rm -f dist/siege-menu-*.jar
          cp "$jar_path" dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/write-manifest.py "$jar_path" "${{ github.sha }}"
          git add -f dist/
          if ! git diff --cached --quiet; then
            git commit -m "build: publish validated Siege jar [skip ci]"
            git push
          fi
