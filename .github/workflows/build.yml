name: Build Forge mod

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compile and verify
        run: gradle --no-daemon clean build
      - uses: actions/upload-artifact@v4
        with:
          name: siege-menu-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Publish validated jar for Windows installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          jar_path="$(find build/libs -maxdepth 1 -type f -name 'siege-menu-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          test -n "$jar_path"
          mkdir -p dist
          rm -f dist/siege-menu-*.jar
          cp "$jar_path" dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          if ! git diff --cached --quiet; then
            git commit -m "build: publish validated Siege jar [skip ci]"
            git push
          fi
