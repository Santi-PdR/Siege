name: One-shot SIEGE 5.10 player language cleanup

on:
  push:
    branches:
      - chatgpt/siege-5.10-player-facing-media

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/siege-5.10-player-facing-media
      - name: Remove research wording from Intel player UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/uy/santipdr/siege/client/IntelScreenV3.java')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'label("REPORTE", "REPORT")': 'label("DATOS PARCIALES", "PARTIAL DATA")',
              'label("Fuente: testimonio de jugador. No verificado por staff.", "Source: player testimony. Not staff-verified.")': 'label("Información incompleta: algunos datos pueden cambiar.", "Incomplete information: some details may change.")',
              'label("Campos documentados; no mide la certeza de la información.", "Documented fields; this does not measure information certainty.")': 'label("Resumen del expediente disponible.", "Summary of the available dossier.")',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected Intel wording not found: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          if grep -nEi 'staff[- ]verified|verificado por staff|fuente: testimonio|source: player testimony' src/main/java/uy/santipdr/siege/client/IntelScreenV3.java; then
            echo 'Technical/player-testimony wording remains in IntelScreenV3.'
            exit 1
          fi

      - name: Commit cleanup and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/zz-autofix-player-language-510.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/uy/santipdr/siege/client/IntelScreenV3.java .github/workflows/zz-autofix-player-language-510.yml
          git commit -m 'fix: remove research language from Intel player UI'
          git push origin HEAD:chatgpt/siege-5.10-player-facing-media
